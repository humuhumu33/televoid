<!doctype html>
<!-- watch.html — TELEVOID: one page, one television.
     ?role=gen     the BROADCAST DESK (creator device): chat → Minimax → seal → sign → fabric
     ?role=viewer  a receiving set: verify → assemble → play on the shared clock → relay onward
     The witnesses drive THIS page — the product path, not test glue.
     Engine contract (do not break): query params role/id/room/secret/k/cap/pub/clipmode/door/model,
     window.state fields, window.sendChat/leaveNet/net/transcodeClip. -->
<html><head><meta charset="utf-8">
<title>TELEVOID</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="television from realities that don't exist">
<meta property="og:title" content="TELEVOID">
<meta property="og:description" content="A TV set that receives broadcasts from realities that don't exist, with no server behind it.">
<meta property="og:type" content="video.other">
<meta property="og:image" content="https://humuhumu33.github.io/televoid/web/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📺</text></svg>">
<style>
  /* ── THE GOLDEN RATIO SYSTEM (style witness enforced) ──────────────────────
     --phi = 1.618. The set splits screen : console at phi : 1 (the grid rows).
     Type scale steps by phi from 16px:  10 → 16 → 26 → 42.
     Spacing: the base unit is 10px; steps multiply by phi: 10, 16, 26, 42. */
  :root { --phi: 1.618; --u: 10px; --u1: 16px; --u2: 26px; --u3: 42px;
          --t0: 10px; --t1: 16px; --t2: 26px; --t3: 42px;
          --ink: #cfe3d8; --dim: #5d7a6e; --glow: #7dffb0; --amber: #ffd27d; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { position: fixed; inset: 0; background: #04060a; color: var(--ink);
         font: var(--t1)/1.45 ui-monospace, "Cascadia Mono", Menlo, monospace;
         user-select: none; -webkit-user-select: none; }
  #set { display: grid; grid-template-rows: minmax(0, 1.618fr) 1fr; /* screen : console = phi : 1 */
         height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right)
         env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* ── the screen ── */
  #screen { position: relative; display: flex; align-items: center; justify-content: center;
            min-height: 0; padding: var(--u1);
            background: radial-gradient(120% 100% at 50% 30%, #0a1210 0%, #04060a 70%); }
  #tv { position: relative; aspect-ratio: 16/9; max-width: 100%; max-height: 100%;
        width: min(100%, calc((100dvh * var(--phi) / (1 + var(--phi)) - var(--u3)) * 16 / 9));
        background: #000; border-radius: var(--u); overflow: hidden;
        box-shadow: 0 0 0 1px #16261f, 0 var(--u2) var(--u3) rgba(0,0,0,.6), inset 0 0 var(--u3) rgba(0,0,0,.8); }
  #tv video, #tv img.frame, #tv canvas.stage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #noise { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none;
           transition: opacity 80ms linear; image-rendering: pixelated; }
  #tv.static #noise, #tv.tuning #noise { opacity: 1; }
  #scan { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: .5;
          background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px); }
  #vig { position: absolute; inset: 0; pointer-events: none;
         background: radial-gradient(100% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }

  #ident { position: absolute; top: var(--u1); right: var(--u1); font-size: var(--t2); letter-spacing: .06em;
           color: var(--glow); text-shadow: 0 0 var(--u) rgba(125,255,176,.9), 0 0 var(--u2) rgba(125,255,176,.4); }
  #livechip { position: absolute; top: var(--u1); left: var(--u1); font-size: var(--t0); letter-spacing: .2em;
              padding: 4px var(--u); border: 1px solid currentColor; border-radius: 3px; cursor: pointer; }
  #livechip.live { color: #ff6d6d; text-shadow: 0 0 var(--u) rgba(255,109,109,.8); animation: blink 1.6s infinite; }
  #livechip.rew { color: var(--amber); }
  @keyframes blink { 50% { opacity: .45; } }
  #caption { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--u2) var(--u2) var(--u1);
             font-size: var(--t1); color: #eafff3; text-shadow: 0 1px 3px #000;
             background: linear-gradient(transparent, rgba(0,0,0,.75)); }
  #caption .from { display: block; font-size: var(--t0); color: var(--glow); letter-spacing: .12em; }
  #tunecard { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
              justify-content: center; gap: var(--u); text-align: center; background: rgba(0,0,0,.35); }
  #tv.tuning #tunecard { display: flex; }
  #tunecard .big { font-size: var(--t2); color: var(--glow); text-shadow: 0 0 var(--u2) rgba(125,255,176,.6);
                   background: rgba(0,0,0,.55); padding: var(--u) var(--u2); border-radius: var(--u); }
  #tunecard .sub { font-size: var(--t0); color: var(--ink); letter-spacing: .2em;
                   background: rgba(0,0,0,.55); padding: 4px var(--u1); border-radius: var(--u); }
  #tv.tuning #livechip { display: none; }

  /* ── the console ── */
  #console { display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: var(--u1); padding: var(--u1) var(--u2); min-height: 0; }
  #row1 { display: flex; align-items: center; gap: var(--u2); }
  #zap { width: calc(var(--u3) * 2); height: calc(var(--u3) * 2); border-radius: 50%; cursor: pointer;
         border: 1px solid #2c4a3c; color: var(--glow); background: radial-gradient(circle at 35% 30%, #10241c, #071009);
         font: 700 var(--t1) ui-monospace, monospace; letter-spacing: .15em;
         box-shadow: 0 var(--u) var(--u2) rgba(0,0,0,.6), inset 0 1px 0 rgba(125,255,176,.15); }
  #zap:active { transform: translateY(2px); }
  .key { border: 1px solid #23392f; background: #0a1410; color: var(--ink); border-radius: var(--u);
         padding: var(--u) var(--u1); font: var(--t0) ui-monospace, monospace; letter-spacing: .1em; cursor: pointer; }
  .key:hover { border-color: #3a5f4d; color: #fff; }
  #prompt { width: min(560px, 88vw); background: #0a1410; border: 1px solid #23392f; border-radius: var(--u);
            color: var(--ink); padding: var(--u1); font: var(--t1) ui-monospace, monospace; outline: none; }
  #prompt::placeholder { color: var(--dim); }
  #prompt:focus { border-color: var(--glow); box-shadow: 0 0 var(--u1) rgba(125,255,176,.15); }
  #row2 { display: flex; flex-direction: column; gap: var(--u); align-items: center; }
  .field { width: min(560px, 88vw); background: #0a1410; border: 1px solid #23392f; border-radius: var(--u);
           color: var(--ink); padding: var(--u1); font: var(--t1) ui-monospace, monospace; outline: none; }
  .field::placeholder { color: var(--dim); }
  .field:focus { border-color: var(--glow); box-shadow: 0 0 var(--u1) rgba(125,255,176,.15); }
  #metaRow { display: flex; gap: var(--u2); align-items: baseline; font-size: var(--t0); color: var(--dim); letter-spacing: .12em; }
  #metaRow .mark { color: var(--ink); font-weight: 700; letter-spacing: .3em; }
  #toast { position: fixed; left: 50%; bottom: calc(var(--u3) + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
           background: #0d1a14; border: 1px solid #2c4a3c; color: var(--glow); border-radius: var(--u);
           padding: var(--u) var(--u2); font-size: var(--t0); letter-spacing: .1em; opacity: 0; transition: all .25s; pointer-events: none; }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 680px) { #row1 { gap: var(--u1); } #zap { width: 68px; height: 68px; } }
</style></head><body>
<div id="set">
  <div id="screen"><div id="tv" class="tuning">
    <div id="media"></div>
    <canvas id="noise" width="128" height="72"></canvas>
    <div id="scan"></div><div id="vig"></div>
    <div id="livechip" class="live"></div>
    <div id="ident"></div>
    <div id="caption"></div>
    <div id="tunecard"><div class="big"></div><div class="sub"></div></div>
  </div></div>
  <div id="console">
    <div id="row1"></div>
    <div id="row2"></div>
    <div id="metaRow"></div>
  </div>
</div>
<div id="toast"></div>
<script type="module">
import { makeGenerator, makeViewer, roomKeyFromSecret } from "../src/channel.mjs";
import { createChannel, verifyEntrySig } from "../src/strand.mjs";
import { makeMeter } from "../src/measure.mjs";
import { openStore } from "../src/store.mjs";
import { sha256hex } from "../src/wire.mjs";
import { joinTree } from "./link.mjs";
import { NAME, TAGLINE, STR, PHI } from "./strings.mjs";

const q = new URLSearchParams(location.search);
const role = q.get("role") || "viewer";
const id = q.get("id") || role + "-" + Math.random().toString(36).slice(2, 7);
const room = q.get("room") || "televoid";
const secret = q.get("secret") || "openinvite";
const k = +(q.get("k") || 2);
// cap: "leaf" pins a set that must never forward · "relay" pins a tower ·
// absent → AUTOMATIC: the set starts as a leaf and EARNS towerhood by measure.
const cap = q.get("cap") || null;
const base = location.origin;
// The rendezvous door: on ANY real host (GitHub Pages included) the default is
// the SERVERLESS broker door (public MQTT, content blind, sealed) — nothing we
// operate is in the loop. The local witness relay is used only on loopback, or
// when forced with door=local; door=broker forces the serverless door anywhere.
const local = ["127.0.0.1", "localhost", "[::1]"].includes(location.hostname);
const useBroker = q.get("door") === "broker" || (!local && q.get("door") !== "local");
const door = useBroker ? (await import("./broker-door.mjs")).makeBrokerDoor({ secret }) : null;

const S = (window.state = { role, id, cap, published: [], played: [], chat: [], links: 0, mode: null,
  pub: null, err: null, peers: [], tree: null, members: 1, paintMs: null, zapMs: null, readySlack: [], phi: PHI,
  capNow: null, tower: false, historyCount: 0, histFrom: {}, histRejects: 0, servedBytes: 0, txBytes: 0, storeStats: null });
const BEAT = +(q.get("beat") || 1200);
window.onerror = (m) => (S.err = String(m));
const b64u = { enc: (o) => btoa(JSON.stringify(o)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""),
               dec: (s) => JSON.parse(atob(s.replace(/-/g, "+").replace(/_/g, "/"))) };
const $ = (s) => document.querySelector(s);
const el = (tag, css, html) => { const e = document.createElement(tag); if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; return e; };

// instant reload: the set remembers itself (service worker, cache first)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});

// ── the static field (all waiting is costumed as weather between realities) ──
const noise = $("#noise"), nctx = noise.getContext("2d");
function drawNoise() {
  const d = nctx.createImageData(128, 72);
  for (let i = 0; i < d.data.length; i += 4) { const v = (Math.random() * 255) | 0; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  nctx.putImageData(d, 0, 0);
  if (S.paintMs == null) S.paintMs = performance.now();     // first picture = static; clocked from navigation start
}
(function storm() { drawNoise(); requestAnimationFrame(storm); })();

// ── the zap sound (made of math, no assets; born on first gesture) ──────────
let actx = null;
function zapSound() {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const n = actx.createBuffer(1, actx.sampleRate * 0.09, actx.sampleRate);
    const ch = n.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const src = actx.createBufferSource(); src.buffer = n;
    const g = actx.createGain(); g.gain.setValueAtTime(0.22, actx.currentTime);
    src.connect(g).connect(actx.destination); src.start();
  } catch {}
}

const tv = $("#tv");
const realityOf = (kappa) => STR.reality + " " + ((parseInt(String(kappa).slice(0, 5), 16) % 90000) + 10000);
$("#tunecard .big").textContent = STR.tuning + "…";
$("#tunecard .sub").textContent = NAME + " · " + TAGLINE;
$("#livechip").textContent = STR.live;
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); };

// ── share: the link IS the product ──────────────────────────────────────────
function shareUrl() {
  const u = new URL(location.href);
  u.searchParams.set("role", "viewer");
  for (const p of ["id", "clipmode", "cap", "model"]) u.searchParams.delete(p);
  if (S.pub) u.searchParams.set("pub", S.pub);
  return u.toString();
}
async function share() {
  const url = shareUrl();
  if (navigator.share) { try { await navigator.share({ title: NAME, text: TAGLINE, url }); return; } catch {} }
  try { await navigator.clipboard.writeText(url); toast(STR.shared); } catch { toast(url); }
}

let net = null;
const tick = () => { if (net) { S.links = net.linkCount(); S.peers = net.peers(); S.tree = net.view(); S.members = net.members().length;
    S.capNow = net.capNow(); S.tower = !!(S.tree && S.tree.tower); S.txBytes = net.txBytes(); }
  const tail = role === "gen" ? STR.broadcasts(S.published.length) : S.tower ? STR.tower : TAGLINE;
  $("#metaRow").innerHTML = `<span class="mark">${NAME}</span><span>${STR.receiving(S.members)}</span><span>${tail}</span>`; };
setInterval(tick, 300);

const roomKey = await roomKeyFromSecret(secret);

if (role === "gen") {
  // ── THE BROADCAST DESK ────────────────────────────────────────────────────
  const channel = await createChannel();
  S.pub = b64u.enc({ alg: channel.alg, jwk: channel.publicJwk });
  let lastPrompt = TAGLINE, lastFrom = null;
  const gen = makeGenerator({ roomKey, channel, self: id, lagMs: 1500,
    onChat: (m) => { S.chat.push(m); lastPrompt = m.text; lastFrom = m.from; } });
  // the desk pins "leaf" (the pin class): a SOURCE, never a relay — it sits as
  // a leaf in BOTH braid trees, the audience carries every copy, and the
  // desk's uplink is O(1) in the audience (its two parent edges).
  net = await joinTree({ base, room, self: id, k, cap: "leaf", fabric: gen.fabric, door, beatMs: BEAT });

  tv.classList.remove("tuning");
  $("#livechip").textContent = STR.onAir;
  const canvas = el("canvas"); canvas.className = "stage"; canvas.width = 320; canvas.height = 180;
  $("#media").appendChild(canvas);
  const ctx = canvas.getContext("2d");
  let f = 0;
  setInterval(() => {
    f++;
    ctx.fillStyle = `hsl(${(f * 3) % 360} 60% 12%)`; ctx.fillRect(0, 0, 320, 180);
    ctx.fillStyle = `hsl(${(f * 7) % 360} 80% 60%)`;
    ctx.fillRect(30 + 100 * (1 + Math.sin(f / 9)), 40 + 40 * (1 + Math.cos(f / 7)), 60, 60);
    ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.font = "12px monospace";
    ctx.fillText(String(f), 300 - 8 * String(f).length, 172);
  }, 66);

  const FAL_MODEL = q.get("model") || "fal-ai/minimax/h3-max/text-to-video";
  // the desk speaks: typing here steers the channel INSTANTLY (viewers steer
  // it too, over the fabric — the desk just has the shortest path).
  const promptIn = el("input"); promptIn.className = "field"; promptIn.placeholder = STR.steer;
  promptIn.onkeydown = (e) => { if (e.key === "Enter" && promptIn.value.trim()) { lastPrompt = promptIn.value.trim(); lastFrom = null; promptIn.value = ""; toast(STR.steered); } };
  const keyIn = el("input"); keyIn.type = "password"; keyIn.className = "field";
  keyIn.placeholder = STR.transmitterPower;
  try { keyIn.value = localStorage.getItem("ic-falkey") || ""; } catch {}
  keyIn.onchange = () => { try { localStorage.setItem("ic-falkey", keyIn.value); } catch {} };
  const shareBtn = el("button", null, STR.share); shareBtn.className = "key"; shareBtn.onclick = share;
  const deskMark = el("div", `font-size:var(--t0);color:var(--dim);letter-spacing:.3em`, STR.desk);
  $("#row1").append(deskMark, shareBtn);
  $("#row2").append(promptIn, keyIn);

  async function falGenerate(prompt) {
    const H = { authorization: "Key " + keyIn.value.trim(), "content-type": "application/json" };
    const sub = await fetch("https://queue.fal.run/" + FAL_MODEL, { method: "POST", headers: H, body: JSON.stringify({ prompt }) });
    if (!sub.ok) throw new Error("submit " + sub.status);
    const qd = await sub.json();
    for (;;) {
      const st = await (await fetch(qd.status_url, { headers: H })).json();
      if (st.status === "COMPLETED") break;
      if (st.status === "FAILED" || st.error) throw new Error("generation failed");
      await new Promise((r) => setTimeout(r, 600));
    }
    const out = await (await fetch(qd.response_url, { headers: H })).json();
    const u = out.video?.url || out.videos?.[0]?.url; if (!u) throw new Error("no video url");
    return new Uint8Array(await (await fetch(u)).arrayBuffer());
  }

  const MIME = q.get("clipmode") === "png" ? null :
    ["video/webm;codecs=vp8", "video/webm"].find((m) => typeof MediaRecorder !== "undefined" && MediaRecorder.isTypeSupported(m));
  const capture = MIME ? canvas.captureStream(15) : null;
  async function makeClip(ms) {
    if (MIME) {
      S.mode = "webm";
      const rec = new MediaRecorder(capture, { mimeType: MIME, videoBitsPerSecond: 400_000 });
      const chunks = [];
      rec.ondataavailable = (e) => e.data && e.data.size && chunks.push(e.data);
      return new Promise((res) => {
        rec.onstop = async () => res(new Uint8Array(await new Blob(chunks, { type: MIME }).arrayBuffer()));
        rec.start(); setTimeout(() => { try { rec.stop(); } catch {} }, ms);
      });
    }
    S.mode = "png";
    return new Promise((res) => canvas.toBlob(async (b) => res(new Uint8Array(await b.arrayBuffer())), "image/png"));
  }
  async function transcodeClip(bytes, kbps = 3000) {
    if (!MIME) return null;
    const url = URL.createObjectURL(new Blob([bytes], { type: "video/mp4" }));
    const v = el("video"); v.muted = true; v.src = url;
    await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error("mp4 decode")); });
    const durMs = Math.round(v.duration * 1000) || 5000;   // the SOURCE knows its length — the schedule needs it
    const c = el("canvas");
    c.width = 1280; c.height = Math.round((1280 * v.videoHeight) / v.videoWidth) || 720;
    const cx = c.getContext("2d");
    const rec = new MediaRecorder(c.captureStream(24), { mimeType: MIME, videoBitsPerSecond: kbps * 1000 });
    const chunks = []; rec.ondataavailable = (e) => e.data && e.data.size && chunks.push(e.data);
    const draw = setInterval(() => { try { cx.drawImage(v, 0, 0, c.width, c.height); } catch {} }, 1000 / 24);
    const done = new Promise((res) => (rec.onstop = res));
    rec.start(); await v.play();
    await new Promise((res) => (v.onended = res));
    rec.stop(); clearInterval(draw); await done; URL.revokeObjectURL(url);
    return { bytes: new Uint8Array(await new Blob(chunks, { type: MIME }).arrayBuffer()), durMs };
  }
  window.transcodeClip = transcodeClip;
  async function measureDur(bytes, fallback = 5000) {
    try {
      const url = URL.createObjectURL(new Blob([bytes], { type: "video/mp4" }));
      const v = el("video"); v.preload = "metadata"; v.muted = true; v.src = url;
      await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = rej; setTimeout(rej, 3000); });
      const d = Math.round(v.duration * 1000); URL.revokeObjectURL(url);
      return d > 500 ? d : fallback;
    } catch { return fallback; }
  }

  // the desk MONITOR: in dream mode the operator watches the actual broadcast,
  // not the test pattern.
  const deskVid = el("video"); deskVid.className = "stage"; deskVid.autoplay = true; deskVid.muted = true;
  deskVid.playsInline = true; deskVid.style.display = "none";
  $("#media").appendChild(deskVid);
  let deskUrl = null;
  function announce(e, title, tfrom, bytes, preview) {
    S.published.push({ seq: e.body.seq, kappa: e.kappa, size: bytes.length });
    $("#ident").textContent = realityOf(e.kappa);
    $("#caption").innerHTML = (tfrom ? `<span class="from">${STR.transmissionFrom(tfrom)}</span>` : "") + title;
    if (preview) {
      canvas.style.display = "none"; deskVid.style.display = "";
      if (deskUrl) URL.revokeObjectURL(deskUrl);
      deskUrl = URL.createObjectURL(new Blob([bytes], { type: bytes[4] === 0x66 ? "video/mp4" : "video/webm" }));
      deskVid.src = deskUrl; deskVid.play().catch(() => {});
    }
  }

  // ── THE CONTINUOUS DREAM PIPELINE ─────────────────────────────────────────
  // Generation runs AHEAD of the clock: up to INFLIGHT clips dream in
  // parallel, and every finished clip is scheduled to air the INSTANT the
  // previous one ends (startAt chains by real measured duration). Viewers hold
  // segments before air time, so the cut lands on the clock — no gap, no
  // spinner, continuous television from the first clip on. Falling behind is
  // not an error: the set shows static between realities, which is exactly
  // what a set does.
  const LEAD = 4000;
  const INFLIGHT = 2;
  let inflight = 0, nextAir = 0;
  async function dreamOne() {
    const title = lastPrompt, tfrom = lastFrom;
    try {
      S.mode = "fal";
      const mp4 = await falGenerate(title);
      const t = await transcodeClip(mp4).catch(() => null);
      const bytes = t ? t.bytes : mp4;
      const durMs = t ? t.durMs : await measureDur(mp4);
      const now = Date.now();
      if (nextAir < now + LEAD) nextAir = now + LEAD;
      const startAt = nextAir; nextAir += durMs;
      const e = await gen.publishClip(bytes, { title, durMs, startAt, tfrom });
      announce(e, title, tfrom, bytes, true);
      S.err = null;
    } catch (e) { S.err = "fal: " + e.message; }
  }
  setInterval(() => {
    if (!keyIn.value.trim()) return;
    while (inflight < INFLIGHT && nextAir - Date.now() < LEAD + 15_000) {   // keep ~15s of future television banked
      inflight++;
      dreamOne().finally(() => { inflight--; });
    }
  }, 400);

  // the TEST PATTERN loop — runs only while no transmitter key is present.
  (async () => {
    for (;;) {
      if (keyIn.value.trim()) { await new Promise((r) => setTimeout(r, 600)); continue; }
      canvas.style.display = ""; deskVid.style.display = "none";
      const tfrom = lastFrom;
      const bytes = await makeClip(1000);
      if (bytes && bytes.length) {
        const e = await gen.publishClip(bytes, { title: lastPrompt, durMs: 1000, tfrom });
        announce(e, lastPrompt, tfrom, bytes, false);
      }
      await new Promise((r) => setTimeout(r, MIME ? 150 : 900));
    }
  })();
} else {
  // ── A RECEIVING SET (and, silently, a tower and an archive) ───────────────
  const pub = b64u.dec(q.get("pub"));
  S.pub = q.get("pub");

  // the meter: the set watches itself watch, and earns towerhood. No UI.
  const meter = makeMeter({ minRate: +(q.get("minrate") || 4000), windowMs: Math.max(1000, BEAT) });
  window.__meter = meter;
  document.addEventListener("visibilitychange", () => meter.setVisible(document.visibilityState === "visible"));

  // the store: everything this set plays, it keeps (bounded) and can serve.
  const store = await openStore().catch(() => null);
  if (!store) meter.setStoreOk(false);
  const SEG = 60_000;
  const splitSegs = (bytes) => { const out = []; for (let o = 0; o < bytes.length; o += SEG) out.push(bytes.subarray(o, Math.min(o + SEG, bytes.length))); return out; };
  async function persist(entry, bytes) {
    if (!store) return;
    try {
      const airAt = entry.body.startAt;
      const segs = splitSegs(bytes);
      for (let i = 0; i < segs.length; i++) await store.put("seg", entry.body.segs[i], airAt, segs[i]);
      const blob = new TextEncoder().encode(JSON.stringify({ body: entry.body, sig: entry.sig }));
      await store.put("man", await sha256hex(blob), airAt, blob);
      meter.setStoreOk(true); S.storeStats = store.stats();
    } catch { meter.setStoreOk(false); }
  }
  const history = {
    serveBlock: async (kappa) => {
      if (!store) return null;
      let b = await store.get(kappa);
      if (b && window.__corruptServe) { b = new Uint8Array(b); b[0] ^= 0xff; }   // witness hook: a lying store
      if (b) S.servedBytes += b.length;
      return b;
    },
    tailEntries: async (n) => {
      if (!store) return [];
      const out = [];
      for (const m of store.manifests(n)) {
        const b = await store.get(m.kappa).catch(() => null);
        if (b) { try { out.push(JSON.parse(new TextDecoder().decode(b))); } catch {} }
      }
      return out;
    },
  };
  const vid = el("video"); vid.autoplay = true; vid.muted = true; vid.playsInline = true;
  const img = el("img"); img.className = "frame"; img.style.display = "none";
  $("#media").append(vid, img);
  vid.addEventListener("loadedmetadata", () => { const p = S.played[S.played.length - 1]; if (p) { p.w = vid.videoWidth; p.h = vid.videoHeight; } });
  img.addEventListener("load", () => { const p = S.played[S.played.length - 1]; if (p) { p.w = img.naturalWidth; p.h = img.naturalHeight; } });
  // a clip that ends before the next one airs leaves not a freeze frame but
  // WEATHER — static between realities is the honest state of a tuned set.
  vid.addEventListener("ended", () => { if (idx === 0) tv.classList.add("static"); });
  setInterval(() => { const p = S.played[S.played.length - 1]; if (p && vid.currentTime > 0) p.t = vid.currentTime; }, 200);

  // the reel: the last few realities this set has received (zap surfs them)
  const reel = [];   // newest first: { url, isPng, meta, kappa }
  let idx = 0;       // 0 = the live moment
  function render() {
    const r = reel[idx]; if (!r) return;
    tv.classList.remove("static");                          // a picture always beats weather
    if (r.isPng) { img.style.display = ""; vid.style.display = "none"; img.src = r.url; }
    else { vid.style.display = ""; img.style.display = "none"; vid.src = r.url; vid.play().catch(() => {}); }
    $("#ident").textContent = realityOf(r.kappa);
    $("#caption").innerHTML = (r.meta.tfrom ? `<span class="from">${STR.transmissionFrom(r.meta.tfrom)}</span>` : "") + (r.meta.title || "");
    const chip = $("#livechip");
    chip.className = idx === 0 ? "live" : "rew";
    chip.textContent = idx === 0 ? STR.live : STR.returnLive;
  }
  function staticBurst(ms, after) {
    tv.classList.add("static"); zapSound();
    setTimeout(() => { tv.classList.remove("static"); after && after(); }, ms);
  }
  window.zap = () => {
    if (!reel.length) return;
    const t = performance.now();
    tv.classList.add("static");
    drawNoise();                                             // the burst exists THIS frame, not the next one
    S.zapMs = performance.now() - t;
    zapSound();
    setTimeout(() => { tv.classList.remove("static"); idx = (idx + 1) % reel.length; render(); }, 300);
  };
  $("#livechip").onclick = () => { if (idx !== 0) staticBurst(220, () => { idx = 0; render(); }); };

  const REEL_MAX = 16;                                       // deeper now that history persists
  function intoReel(front, item) {
    if (front) { reel.unshift(item); if (idx > 0) idx++; }   // live: newest first; surfing not yanked
    else reel.push(item);                                    // history: fills the back of the dial
    while (reel.length > REEL_MAX) { const old = reel.pop(); try { URL.revokeObjectURL(old.url); } catch {} if (idx >= reel.length) idx = 0; }
  }
  const mediaUrl = (bytes) => {
    const isPng = bytes[0] === 0x89 && bytes[1] === 0x50;
    const isMp4 = bytes[4] === 0x66 && bytes[5] === 0x74 && bytes[6] === 0x79 && bytes[7] === 0x70;
    return { url: URL.createObjectURL(new Blob([bytes], { type: isPng ? "image/png" : isMp4 ? "video/mp4" : "video/webm" })), isPng };
  };
  const viewer = makeViewer({ roomKey, alg: pub.alg, publicJwk: pub.jwk, self: id,
    onClip: ({ bytes, meta, kappa, readyAt, entry }) => {
      const { url, isPng } = mediaUrl(bytes);
      intoReel(true, { url, isPng, meta, kappa });
      S.readySlack.push(meta.startAt - readyAt);             // prefetch margin vs the shared clock
      S.played.push({ seq: meta.seq, kappa, size: bytes.length, title: meta.title, at: Date.now(), startAt: meta.startAt });
      tv.classList.remove("tuning");
      if (idx === 0) render();                               // the live cut lands ON the clock, no static
      persist(entry, bytes);                                 // watching IS seeding — silent, bounded, verified
    },
    onChat: (m) => S.chat.push(m) });
  net = await joinTree({ base, room, self: id, k, cap, meter, fabric: viewer.fabric, door, history, beatMs: BEAT });
  window.sendChat = (t) => viewer.sendChat(t);

  // ── tune into the ARCHIVE: fill the reel from the audience, not the desk ──
  (async () => {
    const t0h = Date.now();
    for (let round = 0; round < 75 && S.historyCount < 8; round++) {
      await new Promise((r) => setTimeout(r, 400));
      const entries = await net.wantTail(10);
      for (const e of entries) {
        if (S.historyCount >= 8) break;
        const v = await verifyEntrySig({ alg: pub.alg, publicJwk: pub.jwk }, e);
        if (!v.ok) continue;                                 // unsigned history does not exist
        if (reel.some((r) => r.kappa === v.kappa) || S.played.some((p) => p.kappa === v.kappa)) continue;
        const parts = [];
        let good = true;
        for (const kseg of e.body.segs) {
          const b = await net.wantBlock(kseg, {
            onSource: (peer, n) => (S.histFrom[peer] = (S.histFrom[peer] || 0) + n),
            onReject: () => S.histRejects++ });
          if (!b) { good = false; break; }
          parts.push(b);
        }
        if (!good) continue;
        const bytes = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
        let o = 0; for (const p of parts) { bytes.set(p, o); o += p.length; }
        const { url, isPng } = mediaUrl(bytes);
        intoReel(false, { url, isPng, meta: e.body, kappa: v.kappa });
        S.historyCount++;
        if (S.historyMs == null) S.historyMs = Date.now() - t0h;
        persist({ body: e.body, sig: e.sig }, bytes);        // history re-seeds too
        tv.classList.remove("tuning");
        if (reel.length === 1) render();                     // a late joiner sees television, instantly
      }
    }
  })();

  const zapBtn = el("button", null, STR.zap); zapBtn.id = "zap"; zapBtn.onclick = window.zap;
  const shareBtn = el("button", null, STR.share); shareBtn.className = "key"; shareBtn.onclick = share;
  $("#row1").append(zapBtn, shareBtn);
  const input = el("input"); input.id = "prompt"; input.placeholder = STR.transmit;
  input.onkeydown = (e) => { if (e.key === "Enter" && input.value.trim()) { viewer.sendChat(input.value.trim()); input.value = ""; toast(STR.transmitSent); } };
  $("#row2").appendChild(input);
  window.addEventListener("keydown", (e) => { if (e.key === " " && document.activeElement !== input) { e.preventDefault(); window.zap(); } });
  tv.addEventListener("click", () => window.zap());
}
window.net = () => net;
window.leaveNet = () => net && net.leave();
tick();
</script></body></html>
